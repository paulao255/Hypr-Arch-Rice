#####################
### AUTOGENERATED ###
#####################

autogenerated = 0

################
### MONITORS ###
################

monitor =, preferred@60, auto, 1

#################
### VARIABLES ###
#################

$hyprlockConfig = $HOME/.config/hyprlock/layouts/layout11.conf

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = LANG, en_US.UTF-8

# NVIDIA + HYPRLAND + SWWW FIX!
env = WLR_NO_HARDWARE_CURSORS, 1

#####################
### LOOK AND FEEL ###
#####################

general{
	gaps_in = 2
	gaps_out = 3

	border_size = 1

	col.active_border = rgba(ffffffff)
	col.inactive_border = rgba(00000000)

	resize_on_border = true

	allow_tearing = true

	layout = dwindle
}

decoration{
	rounding = 15
	rounding_power = 2 # Square = 0, Triangle = 1, Rounded = 2.

	active_opacity = 1.0
	inactive_opacity = 1.0

	shadow{
		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}

	blur{
		enabled = true
		size = 5
		passes = 2
		new_optimizations = true
		ignore_opacity = false

		vibrancy = 0.1696
	}
}

animations{
	enabled = yes

	#        NAME,           X0,   Y0,   X1,   Y1
	bezier = easeOutQuint,   0.23, 1,    0.32, 1
	bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
	bezier = linear,         0,    0,    1,    1
	bezier = almostLinear,   0.5,  0.5,  0.75, 1
	bezier = quick,          0.15, 0,    0.1,  1

	#           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
	animation = global,        1,     1.00,  default
	animation = border,        1,     1.00,  easeOutQuint
	animation = windows,       1,     1.00,  easeOutQuint
	animation = windowsIn,     1,     1.00,  easeOutQuint, slide
	animation = windowsOut,    1,     1.00,  linear,       slide
	animation = fadeIn,        1,     1.00,  almostLinear
	animation = fadeOut,       1,     1.00,  almostLinear
	animation = fade,          1,     1.00,  quick
	animation = layers,        1,     1.00,  easeOutQuint
	animation = layersIn,      1,     1.00,  easeOutQuint, slide
	animation = layersOut,     1,     1.00,  linear,       slide
	animation = fadeLayersIn,  1,     1.00,  almostLinear
	animation = fadeLayersOut, 1,     1.00,  almostLinear
	animation = workspaces,    1,     1.00,  almostLinear, slide
	animation = workspacesIn,  1,     1.00,  almostLinear, slide
	animation = workspacesOut, 1,     1.00,  almostLinear, slide
	animation = zoomFactor,    1,     1.00,  quick
}

dwindle{
	preserve_split = true # You probably want this
}

master{
	new_status = master
}

misc {
	force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
	disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background.
}

#############
### INPUT ###
#############

input{
	kb_layout = us, br
	kb_variant =
	kb_model =
	kb_options = grp:alt_shift_toggle
	kb_rules =

	follow_mouse = 1

	sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

	touchpad{
		natural_scroll = true
		scroll_factor = 0.3
	}
}

gesture = 3, horizontal, workspace

###############
### PLUGINS ###
###############

plugin:dynamic-cursors{
	enabled = true
	mode = tilt
	threshold = 2
}

###################
### KEYBINDINGS ###
###################

bind = SUPER SHIFT, T, exec, kitty --start-as fullscreen
bind = SUPER, T, exec, kitty
bind = SUPER, K, exec, showmethekey-gtk -AC
bind = SUPER SHIFT, K, exec, pkill showmethekey-gt
bind = SUPER, Q, killactive,
bind = SUPER, L, exec, hyprlock --config $hyprlockConfig
bind = SUPER, F, exec, kitty yazi $HOME
bind = SUPER, V, togglefloating,
bind = SUPER, R, exec, rofi -show drun
bind = SUPER, P, pseudo
bind = SUPER, N, exec, xdg-open https://www.google.com/
bind = SUPER SHIFT, S, exec, spotify-launcher
bind = SUPER, S, exec, steam
bind = SUPER, D, exec, discord
bind = SUPER, W, exec, xdg-open https://web.whatsapp.com
binde = SUPER, minus, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%
binde = SUPER, equal, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%
bind = SUPER, F1, exec, hyprsunset --temperature 1000
bind = SUPER SHIFT, F1, exec, pkill hyprsunset
bind = SUPER, F2, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = SUPER, F3, exec, waybar
bind = SUPER SHIFT, F3, exec, pkill waybar
bind = SUPER, F4, exec, poweroff
bind = SUPER SHIFT, F4, exec, pkill Hyprland
bind = SUPER, F5, exec, kitty wev
bind = SUPER SHIFT, Z, exec, hyprshot -m output --clipboard-only
bind = SUPER, Z, exec, hyprshot -m output
bind = SUPER, X, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = SUPER SHIFT, X, exec, cliphist wipe
bind = SUPER, RETURN, fullscreen, 0

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#####################
### DEBUG OPTIONS ###
#####################

debug{
	damage_tracking = 0 # NVIDIA + HYPRLAND + SWWW FIX!
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Make float and no focus SMTK.
windowrule = float on, pin on, no_focus on, move 715 820, size 120 50, match:title Floating Window - Show Me The Key

# Fix RDR2 fullscreen glitch.
windowrule{
	name = rdr2
	fullscreen = 1
	match:class = ^(steam_app_1174180)$
}

#########################
### AUTOSTART/STARTUP ###
#########################

exec-once = hyprlock --config $hyprlockConfig
exec-once = waybar
exec-once = xdg-open https://www.google.com/
exec-once = steam
exec-once = discord
exec-once = kitty hyprpm update
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

###############
### SOURCES ###
###############

# HyprEmoji config
source = $HOME/.config/hypremoji/hypremoji.conf
